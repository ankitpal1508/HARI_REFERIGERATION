<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- Background -->
  <rect width="320" height="100" rx="12" fill="#006064"/>

  <!-- Snowflake icon -->
  <!-- Vertical bar -->
  <line x1="46" y1="20" x2="46" y2="80" stroke="#00BCD4" stroke-width="4" stroke-linecap="round"/>
  <!-- Horizontal bar -->
  <line x1="16" y1="50" x2="76" y2="50" stroke="#00BCD4" stroke-width="4" stroke-linecap="round"/>
  <!-- Diagonal 1 -->
  <line x1="24" y1="28" x2="68" y2="72" stroke="#00BCD4" stroke-width="4" stroke-linecap="round"/>
  <!-- Diagonal 2 -->
  <line x1="68" y1="28" x2="24" y2="72" stroke="#00BCD4" stroke-width="4" stroke-linecap="round"/>
  <!-- Branch tips on vertical -->
  <line x1="46" y1="20" x2="38" y2="28" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="20" x2="54" y2="28" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="80" x2="38" y2="72" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="80" x2="54" y2="72" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Branch tips on horizontal -->
  <line x1="16" y1="50" x2="24" y2="42" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="24" y2="58" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="68" y2="42" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="68" y2="58" stroke="#E0F7FA" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="46" cy="50" r="5" fill="#FF6F00"/>

  <!-- Text: HARI -->
  <text x="98" y="52" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="3">HARI</text>
  <!-- Divider line -->
  <line x1="98" y1="58" x2="302" y2="58" stroke="#00BCD4" stroke-width="1.5"/>
  <!-- Text: REFRIGERATION -->
  <text x="98" y="74" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#B2EBF2" letter-spacing="4">REFRIGERATION</text>
</svg>
